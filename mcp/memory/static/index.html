<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Hearth</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<section class="login-shell" id="login-shell">
  <form class="login-card" id="login-form">
    <h1><span>Hearth</span></h1>
    <p>Sign in with your Hearth account to open the dashboard.</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="login-button" type="submit">Sign in</button>
    <p class="error" id="login-error" role="alert"></p>
    <details id="token-login">
      <summary>Sign in with an admin or agent access token</summary>
      <label for="access-token">Access token</label>
      <input id="access-token" type="password" autocomplete="off">
      <button class="secondary" id="token-button" type="button">Use access token</button>
    </details>
  </form>
</section>

<main class="hidden" id="dashboard">
  <header class="topbar">
    <a class="brand" href="#now"><span>Hearth</span></a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Dashboard views">
      <a href="#now" data-route="now">Now</a>
      <a href="#work" data-route="work">Work</a>
      <a href="#memory" data-route="memory">Memory</a>
    </nav>
    <details class="workspace-tools"><summary>Workspace tools</summary><nav aria-label="Workspace tools"><a href="#projects">Projects</a><a href="#communication">Communication</a><a href="#agents">Agents</a><a href="#relays">Relays</a></nav></details>
    <a href="/glossary">Commons glossary</a><a href="/journal">Decision journal</a>
    <span class="grow"></span>
    <span class="stamp" id="stamp"></span>
    <span class="identity" id="identity"></span>
    <button class="secondary small" id="refresh" title="Refresh now">↻</button>
    <button class="secondary small hidden" id="logout">Sign out</button>
  </header>
  <div id="banner" class="banner hidden" role="status"></div>
  <div id="view" class="view" role="tabpanel" aria-label="Dashboard content"></div>
  <aside id="detail" class="detail hidden" aria-label="Details"></aside>
</main>
<script src="/static/app.js"></script>
<script src="/static/work.js"></script>
<script src="/static/slice.js"></script>
</body>
</html>
